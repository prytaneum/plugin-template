name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  publish:
    permissions:
      contents: write
    uses: prytaneum/hestia/.github/workflows/plugin-publish.yml@feature/plugins
    with:
      hestia-ref: refs/heads/feature/plugins
    secrets:
      HESTIA_SIGNING_KEY: ${{ secrets.HESTIA_SIGNING_KEY }}
